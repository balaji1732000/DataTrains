name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run readiness:production
      - run: npm audit --omit=dev --audit-level=high
      - run: bash -n infra/google/deploy-control-plane.sh infra/google/configure-observability.sh
      - run: for file in infra/google/monitoring/*.json; do jq -e . "$file" >/dev/null; done

  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: trajectory
          POSTGRES_USER: trajectory
          POSTGRES_PASSWORD: trajectory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trajectory -d trajectory"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://trajectory:trajectory_test@127.0.0.1:5432/trajectory?sslmode=disable
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.1
          cache: false
      # Integration packages share one ephemeral database and intentionally
      # reset fixtures, so package-level execution must be serial.
      - run: go test -p 1 ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  control-plane-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: datatrains-control-plane:test
      - run: docker run --rm --entrypoint /bin/sh datatrains-control-plane:test -c 'test "$(id -u)" = 65532 && ffprobe -version >/dev/null'
      - uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: datatrains-control-plane:test
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

  collector-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path apps/collector/src-tauri/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path apps/collector/src-tauri/Cargo.toml -p collector-core --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/collector/src-tauri/Cargo.toml -p collector-core
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file apps/collector/src-tauri/Cargo.lock

  collector-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace=@trajectory/collector
      - run: cargo test --manifest-path apps/collector/src-tauri/Cargo.toml -p trajectory-collector
      - run: npm run collector:package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-collector-windows
          path: apps/collector/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  collector-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential file libxdo-dev libssl-dev
          libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev pkg-config
          ffmpeg xinput x11-utils x11-xserver-utils
      - run: npm ci
      - run: npm run build --workspace=@trajectory/collector
      - run: cargo test --manifest-path apps/collector/src-tauri/Cargo.toml -p trajectory-collector
      - run: npm run collector:package:linux
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-collector-linux
          path: apps/collector/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  collector-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build --workspace=@trajectory/collector
      - run: cargo test --manifest-path apps/collector/src-tauri/Cargo.toml -p trajectory-collector
      - run: npm run collector:package:macos
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-collector-macos-unsigned
          path: |
            apps/collector/src-tauri/target/release/bundle/macos/*.app
            apps/collector/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

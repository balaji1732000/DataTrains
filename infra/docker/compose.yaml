services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trajectory
      POSTGRES_USER: trajectory
      POSTGRES_PASSWORD: trajectory_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trajectory -d trajectory"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - ../../data/postgres:/var/lib/postgresql/data


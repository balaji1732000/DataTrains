TRAJECTORY_ENVIRONMENT: production
TRAJECTORY_RUN_MIGRATIONS: "false"
TRAJECTORY_DATABASE_MAX_CONNS: "4"
TRAJECTORY_GCP_PROJECT: datatrains-production
TRAJECTORY_BLOB_BACKEND: r2
TRAJECTORY_R2_ENDPOINT: https://ACCOUNT_ID.r2.cloudflarestorage.com
TRAJECTORY_R2_BUCKET: datatrains-production-artifacts
TRAJECTORY_AUTH_MODE: oidc
TRAJECTORY_OIDC_ISSUER: https://YOUR_TENANT.example.com
TRAJECTORY_OIDC_AUDIENCE: https://api.datatrains.example
TRAJECTORY_ALLOWED_ORIGINS: https://app.datatrains.example
TRAJECTORY_UPLOAD_AUTHORIZATION_TTL: 15m
TRAJECTORY_WORKER_DRAIN: "true"
TRAJECTORY_FFPROBE_PATH: /usr/bin/ffprobe

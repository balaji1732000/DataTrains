[package]
name = "trajectory-collector"
version = "0.1.0"
description = "Explicit, consented computer-use trajectory collector"
edition = "2024"

[workspace]
members = ["crates/collector-core"]
resolver = "2"

[lib]
name = "trajectory_collector_lib"
# Keeping only the Rust library avoids producing an unused dynamic library with
# a large export table when packaging the cross-platform desktop executable.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
collector-core = { path = "crates/collector-core" }
fs2 = "0.4"
keyring = "4.2.0"
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "native-tls", "timing-resistant-secret-traits"] }
reqwest = { version = "0.13.2", default-features = false, features = ["blocking", "form", "json", "native-tls-no-alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-opener = "2.5.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
